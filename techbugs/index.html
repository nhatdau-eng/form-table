<form action "" method="GET">
<fieldset>
<h2>Đăng ký tham gia săn lỗi</h2>
<label for="name">Họ và tên :</label>
<input type="text" id="name" name ="name"required><br></br>
<label for="email">Email liên hệ </label>
<input type="email" id="email" name="email" required > <br><br>
<label for="password">Mật khẩu hệ thống </label>
<input type="password" id="password" name="password" required> <br><br>
<label for="level">Trình độ của bạn </label>
<select id="level"name="level">
    <option value="newbie">Mới tập chơi </option>
    <option value="pro">chuyên nghiệp </option>
</select> 
<br><br>
<label for="exp">Kinh nhiệm nền tảng </label>
<input type="number" id="exp" name="experience">
<br><br>
<button type ="submit">Đăng ký ngay</button>
</fieldset>
</form>
