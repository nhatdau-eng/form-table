<form method="post">
     <h1>Đăng ký ứng tuyển TechTalent</h1>
    <fieldset>
        <legend>Thông tin cá nhân</legend>
        <label>Họ và tên:</label> 
        <input type="text" placeholder="Nhập tên"> <br>
        Giới tính:
    <label for="male">Nam</label>
    <input type="radio" id="male" name="gender">
    <label for="female">Nữ</label>
    <input type="radio" id="female" name="gender"> <br>
    Ngày sinh (dd/mm/yyyy): <input type="date"> <br>
    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="Nhập email">
    </fieldset>
    <fieldset>
        <legend>Thông tin đăng ký</legend>
         <label for="position">Vị trí ứng tuyển:</label>
         <input type="text" id="position" placeholder="Nhập vị trí ứng tuyển"> <br>
         <label for="experience">Kinh nghiệm làm việc:</label>
         <input type="text" id="experience" placeholder="Nhập kinh nghiệm"> <br>
         <label for="education">Trình độ học vấn:</label>
         <input type="text" id="education" placeholder="Nhập trình độ học vấn"> <br>
         <label for="password">Mật khẩu hệ thống:</label>
         <input type="password" id="password" placeholder="Tạo mật khẩu"> <br>
         <label for="cv">Nộp CV (Định dạng PDF):</label>
         <input type="file" id="cv" placeholder="Dán link hoặc đường dẫn file"> <br>
    <button>Gửi Hồ Sơ</button>
</form>
